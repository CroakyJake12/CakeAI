name: Validate CakeAI Android PR

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/validate-android-pr.yml"
      - "global.json"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "src/Haven.Android/**"
      - "src/Haven.Desktop/**"
      - "src/Haven.UI/**"
      - "src/Haven.Core/**"
      - "src/Haven.Application/**"
      - "src/Haven.Infrastructure/**"
      - "src/Haven.Browser/**"

permissions:
  contents: read

concurrency:
  group: validate-cakeai-android-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  android:
    name: Compile and package Android PR
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      AVALONIA_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"

    steps:
      - name: Check out pull request
        uses: actions/checkout@v6

      - name: Install .NET from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install Android workload
        run: dotnet workload install android

      - name: Restore Android head
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/android-pr
          dotnet restore src/Haven.Android/Haven.Android.csproj 2>&1 | tee artifacts/android-pr/restore.log

      - name: Compile Android head
        shell: bash
        run: |
          set -o pipefail
          dotnet build src/Haven.Android/Haven.Android.csproj \
            -c Debug \
            -f net10.0-android \
            --no-restore 2>&1 | tee artifacts/android-pr/build.log

      - name: Package APK
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish src/Haven.Android/Haven.Android.csproj \
            -c Debug \
            -f net10.0-android \
            --no-restore \
            -p:AndroidPackageFormat=apk \
            -p:AndroidKeyStore=false 2>&1 | tee artifacts/android-pr/publish.log

          mapfile -t apks < <(find src/Haven.Android/bin/Debug/net10.0-android -type f -name '*.apk' | sort)
          test "${#apks[@]}" -gt 0
          for apk in "${apks[@]}"; do
            cp "$apk" "artifacts/android-pr/$(basename "$apk")"
          done
          sha256sum artifacts/android-pr/*.apk | tee artifacts/android-pr/SHA256SUMS.txt

      - name: Upload Android validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: CakeAI-Android-PR-${{ github.event.pull_request.number }}
          path: |
            artifacts/android-pr/*.log
            artifacts/android-pr/*.apk
            artifacts/android-pr/SHA256SUMS.txt
          if-no-files-found: ignore
          retention-days: 30

  write-libreoffice-poc:
    name: Validate Haven Write LibreOfficeKit PoC
    if: github.head_ref == 'migration/write-libreoffice-poc-20260907'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AVALONIA_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"

    steps:
      - name: Check out pull request
        uses: actions/checkout@v6

      - name: Install .NET from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install narrow LibreOfficeKit runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ \
            libreoffice-core-nogui \
            libreoffice-writer-nogui \
            libreofficekit-dev

      - name: Record LibreOffice package and ABI evidence
        shell: bash
        run: |
          set -euo pipefail
          dpkg-query -W -f='${Package}\t${Version}\n' \
            libreoffice-core-nogui \
            libreoffice-writer-nogui \
            libreofficekit-dev
          test -f /usr/include/LibreOfficeKit/LibreOfficeKit.h
          if [[ -f /usr/lib/libreoffice/program/libsofficeapp.so ]]; then
            ls -l /usr/lib/libreoffice/program/libsofficeapp.so
          elif [[ -f /usr/lib/libreoffice/program/libmergedlo.so ]]; then
            ls -l /usr/lib/libreoffice/program/libmergedlo.so
          else
            echo 'FAIL: no LibreOfficeKit runtime library found in /usr/lib/libreoffice/program' >&2
            exit 1
          fi

      - name: Restore focused .NET test project
        run: dotnet restore tests/Haven.Infrastructure.Tests/Haven.Infrastructure.Tests.csproj

      - name: Build focused .NET test project
        run: dotnet build tests/Haven.Infrastructure.Tests/Haven.Infrastructure.Tests.csproj -c Release --no-restore

      - name: Run LibreOffice engine configuration tests
        run: >-
          dotnet test tests/Haven.Infrastructure.Tests/Haven.Infrastructure.Tests.csproj
          -c Release
          --no-build
          --filter 'FullyQualifiedName~LibreOfficeWriteEngineOptionsTests'
          --logger 'console;verbosity=normal'

      - name: Create minimal ODT fixture
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZIP_STORED, ZipFile

          destination = Path('/tmp/haven-write-fixture.odt')
          content = '''<?xml version="1.0" encoding="UTF-8"?>
          <office:document-content
              xmlns:office="urn:oasis:names:tc:opendocument:xmlns:office:1.0"
              xmlns:text="urn:oasis:names:tc:opendocument:xmlns:text:1.0"
              office:version="1.3">
            <office:body>
              <office:text>
                <text:p>Haven Write LibreOfficeKit CI fixture</text:p>
              </office:text>
            </office:body>
          </office:document-content>
          '''
          manifest = '''<?xml version="1.0" encoding="UTF-8"?>
          <manifest:manifest
              xmlns:manifest="urn:oasis:names:tc:opendocument:xmlns:manifest:1.0"
              manifest:version="1.3">
            <manifest:file-entry manifest:full-path="/" manifest:media-type="application/vnd.oasis.opendocument.text"/>
            <manifest:file-entry manifest:full-path="content.xml" manifest:media-type="text/xml"/>
          </manifest:manifest>
          '''

          with ZipFile(destination, 'w') as archive:
              archive.writestr('mimetype', 'application/vnd.oasis.opendocument.text', compress_type=ZIP_STORED)
              archive.writestr('content.xml', content, compress_type=ZIP_DEFLATED)
              archive.writestr('META-INF/manifest.xml', manifest, compress_type=ZIP_DEFLATED)

          if destination.stat().st_size <= 0:
              raise SystemExit('ODT fixture creation failed')
          print(destination, destination.stat().st_size)
          PY

      - name: Build and execute native Writer round-trip probe
        shell: bash
        run: |
          set -euo pipefail
          bash eng/linux/write-libreoffice-poc/run-probe.sh \
            /tmp/haven-write-fixture.odt \
            /tmp/haven-write-roundtrip.odt
          test -s /tmp/haven-write-roundtrip.odt
